<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316284A'/%3E%3Cpath d='M7 8h7a2 2 0 0 1 2 2v14a3 3 0 0 0-3-3H7zM25 8h-7a2 2 0 0 0-2 2v14a3 3 0 0 1 3-3h6z' fill='%23E9A11A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section id="login" class="login" hidden>
    <div class="mosaic" id="mosaic" aria-hidden="true"></div>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Library Management System</h1>
      <p class="muted">Sign in to manage books, members and loans.</p>
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn primary wide" type="submit">Sign in</button>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <header class="top">
      <a class="brand" href="#/desk">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M4 6h9a3 3 0 0 1 3 3v17a4 4 0 0 0-4-4H4zM28 6h-9a3 3 0 0 0-3 3v17a4 4 0 0 1 4-4h8z" fill="#E9A11A"/></svg>
        <span>Library Management System</span>
      </a>
      <nav aria-label="Main">
        <a href="#/desk" data-page="desk">Desk</a>
        <a href="#/catalogue" data-page="catalogue">Books</a>
        <a href="#/circulation" data-page="circulation">Issue &amp; return</a>
        <a href="#/members" data-page="members">Members</a>
      </nav>
      <div class="who">
        <span id="whoami"></span>
        <button class="linklike" id="logout" type="button">Sign out</button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <dialog id="dlg"></dialog>
  <dialog id="cfm"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
